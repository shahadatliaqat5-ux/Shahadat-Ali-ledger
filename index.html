<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahadat Ledger</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f7fb;
  color:#172033;
}
.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}
header{
  background:#1769aa;
  color:white;
  padding:25px 20px;
  border-radius:0 0 20px 20px;
  text-align:center;
}
header h1{margin:0 0 6px;font-size:30px}
header p{margin:0;font-size:16px}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:18px 0;
}
.card{
  background:white;
  border-radius:14px;
  padding:16px;
  text-align:center;
  box-shadow:0 2px 10px #00000012;
}
.card small{display:block;color:#667085}
.card strong{font-size:22px;display:block;margin-top:5px}

.income{color:#16803c}
.expense{color:#c62828}
.balance{color:#1769aa}

.box{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 2px 10px #00000012;
}
.box h2{margin-top:0}

label{
  display:block;
  margin:10px 0 5px;
  font-weight:600;
}
input,select,button{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:16px;
}
button{
  border:0;
  background:#1769aa;
  color:white;
  font-weight:700;
  cursor:pointer;
}
button:hover{opacity:.9}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.export{background:#16803c}
.clear{background:#c62828}

.search{
  margin-bottom:15px;
}

.record{
  border:1px solid #e4e7ec;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  background:#fff;
}
.record-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.record-title{font-weight:700}
.record-date{color:#667085;font-size:13px}
.record-amount{font-size:19px;font-weight:800}
.record-desc{
  margin-top:7px;
  color:#475467;
}
.delete{
  width:auto;
  padding:7px 12px;
  background:#c62828;
  font-size:13px;
  margin-top:10px;
}

.empty{
  text-align:center;
  color:#667085;
  padding:25px;
}

.count{
  text-align:center;
  color:#667085;
  margin-bottom:10px;
}

@media(max-width:650px){
  .cards{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr}
  header h1{font-size:25px}
}
</style>
</head>

<body>

<header>  <h1>Shahadat Ledger</h1>
  <p>روزانہ آمدن اور خرچ کا حساب</p>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <small>کل آمدن</small>
      <strong class="income" id="totalIncome">Rs 0</strong>
    </div>

    <div class="card">
      <small>کل خرچ</small>
      <strong class="expense" id="totalExpense">Rs 0</strong>
    </div>

    <div class="card">
      <small>بقایا رقم</small>
      <strong class="balance" id="balance">Rs 0</strong>
    </div>
  </div>

  <div class="box">
    <h2>نیا ریکارڈ شامل کریں</h2>

    <div class="form-grid">
      <div>
        <label>قسم</label>
        <select id="type">
          <option value="income">آمدن</option>
          <option value="expense">خرچ</option>
        </select>
      </div>

      <div>
        <label>رقم</label>
        <input id="amount" type="number" min="0" placeholder="مثلاً 5000">
      </div>

      <div>
        <label>تفصیل</label>
        <input id="description" type="text" placeholder="مثلاً تنخواہ، راشن">
      </div>

      <div>
        <label>تاریخ</label>
        <input id="date" type="date">
      </div>
    </div>

    <button onclick="addRecord()" style="margin-top:14px">
      ریکارڈ محفوظ کریں
    </button>

    <div class="actions">
      <button class="export" onclick="exportCSV()">CSV فائل بنائیں</button>
      <button class="clear" onclick="clearAll()">تمام ریکارڈ حذف کریں</button>
    </div>
  </div>

  <div class="box">
    <h2>ریکارڈز</h2>

    <input
      class="search"
      id="search"
      type="text"
      placeholder="ریکارڈ تلاش کریں..."
      oninput="showRecords()"
    >

    <div class="count" id="count"></div>
    <div id="records"></div>
  </div>

</div>

<script>
const STORAGE_KEY = "shahadatLedgerRecords";

let records = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "[]"
);

const dateInput = document.getElementById("date");

const today = new Date();
const yyyy = today.getFullYear();
const mm = String(today.getMonth()+1).padStart(2,"0");
const dd = String(today.getDate()).padStart(2,"0");

dateInput.value = yyyy + "-" + mm + "-" + dd;

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function money(value){
  return "Rs " + Number(value).toLocaleString("en-PK");
}

function addRecord(){
  const type = document.getElementById("type").value;
  const amount = Number(document.getElementById("amount").value);
  const description = document.getElementById("description").value.trim();
  const date = document.getElementById("date").value;

  if(!amount || amount <= 0){
    alert("براہ کرم صحیح رقم لکھیں۔");
    return;
  }

  if(!description){
    alert("براہ کرم تفصیل لکھیں۔");
    return;
  }

  if(!date){
    alert("براہ کرم تاریخ منتخب کریں۔");
    return;
  }

  records.unshift({
    id: Date.now(),
    type:type,
    amount:amount,
    description:description,
    date:date
  });

  save();

  document.getElementById("amount").value = "";
  document.getElementById("description").value = "";

  showRecords();
}

function deleteRecord(id){
  if(!confirm("کیا آپ یہ ریکارڈ حذف کرنا چاہتے ہیں؟")){
    return;
  }

  records = records.filter(function(r){
    return r.id !== id;
  });

  save();
  showRecords();
}

function clearAll(){
  if(records.length === 0){
    alert("حذف کرنے کے لیے کوئی ریکارڈ نہیں ہے۔");
    return;
  }

  if(!confirm("کیا آپ تمام ریکارڈ حذف کرنا چاہتے ہیں?")){
    return;
  }

  records = [];
  save();
  showRecords();
}

function showRecords(){
  const search =
    document.getElementById("search").value.toLowerCase().trim();

  const filtered = records.filter(function(r){
    return (
      r.description.toLowerCase().includes(search) ||
      r.date.includes(search) ||
      r.type.toLowerCase().includes(search)
    );
  });

  const totalIncome = records
    .filter(r => r.type === "income")
    .reduce((sum,r) => sum + Number(r.amount),0);

  const totalExpense = records
    .filter(r => r.type === "expense")
    .reduce((sum,r) => sum + Number(r.amount),0);

  const balance = totalIncome - totalExpense;

  document.getElementById("totalIncome").textContent =
    money(totalIncome);

  document.getElementById("totalExpense").textContent =
    money(totalExpense);

  document.getElementById("balance").textContent =
    money(balance);

  document.getElementById("count").textContent =
    "کل ریکارڈ: " + records.length;

  const container = document.getElementById("records");

  if(filtered.length === 0){
    container.innerHTML =
      '<div class="empty">کوئی ریکارڈ موجود نہیں</div>';
    return;
  }

  container.innerHTML = filtered.map(function(r){
    const isIncome = r.type === "income";

    return `
      <div class="record">
        <div class="record-top">
          <div>
            <div class="record-title">
              ${isIncome ? "آمدن" : "خرچ"}
            </div>

            <div class="record-date">
              ${r.date}
            </div>
          </div>

          <div class="record-amount ${isIncome ? "income" : "expense"}">
            ${isIncome ? "+" : "-"} ${money(r.amount)}
          </div>
        </div>

        <div class="record-desc">
          ${escapeHTML(r.description)}
        </div>

        <button
          class="delete"
          onclick="deleteRecord(${r.id})">
          حذف کریں
        </button>
      </div>
    `;
  }).join("");
}

function escapeHTML(text){
  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function exportCSV(){
  if(records.length === 0){
    alert("Export کرنے کے لیے کوئی ریکارڈ نہیں ہے۔");
    return;
  }

  let csv = "\uFEFF";
  csv += "قسم,رقم,تفصیل,تاریخ\n";

  records.forEach(function(r){
    const type = r.type === "income" ? "آمدن" : "خرچ";
    const description =
      '"' + r.description.replace(/"/g,'""') + '"';

    csv +=
      type + "," +
      r.amount + "," +
      description + "," +
      r.date + "\n";
  });

  const blob = new Blob(
    [csv],
    {type:"text/csv;charset=utf-8;"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "shahadat-ledger.csv";

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  URL.revokeObjectURL(url);
}

showRecords();
</script>

</body>
</html>
