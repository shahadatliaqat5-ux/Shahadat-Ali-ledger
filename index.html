<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahadat Ledger</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f6fa;
color:#172033
}

header{
background:#1769aa;
color:white;
padding:25px 15px;
text-align:center;
border-radius:0 0 20px 20px
}

header h1{
margin:0 0 8px;
font-size:30px
}

header p{
margin:0;
font-size:16px
}

.container{
max-width:800px;
margin:auto;
padding:15px
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:15px 0
}

.card{
background:white;
padding:16px 8px;
border-radius:14px;
text-align:center;
box-shadow:0 2px 8px #0001
}

.card small{
display:block;
color:#667085
}

.card strong{
display:block;
font-size:20px;
margin-top:6px
}

.income{color:#16803c}
.expense{color:#c62828}
.balance{color:#1769aa}

.box{
background:white;
padding:18px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 8px #0001
}

h2{
margin-top:0
}

label{
display:block;
font-weight:bold;
margin:10px 0 5px
}

input,select,button{
width:100%;
padding:13px;
font-size:16px;
border-radius:10px;
border:1px solid #ccd3dc
}

button{
background:#1769aa;
color:white;
border:0;
font-weight:bold;
margin-top:12px
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.export{background:#16803c}
.clear{background:#c62828}

.record{
background:#fff;
border:1px solid #e1e5ea;
border-radius:12px;
padding:14px;
margin-bottom:10px
}

.recordTop{
display:flex;
justify-content:space-between;
gap:10px
}

.amount{
font-size:18px;
font-weight:bold
}

.date{
font-size:13px;
color:#667085;
margin-top:4px
}

.description{
margin-top:8px;
color:#475467
}

.delete{
width:auto;
padding:8px 14px;
background:#c62828;
font-size:13px
}

.empty{
text-align:center;
color:#667085;
padding:25px
}

@media(max-width:600px){
.cards{
grid-template-columns:1fr
}

.actions{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<header>
<h1>Shahadat Ledger</h1>
<p>روزانہ آمدن اور خرچ کا حساب</p>
</header>

<div class="container">

<div class="cards">

<div class="card">
<small>کل آمدن</small>
<strong class="income" id="income">Rs 0</strong>
</div>

<div class="card">
<small>کل خرچ</small>
<strong class="expense" id="expense">Rs 0</strong>
</div>

<div class="card">
<small>بقایا رقم</small>
<strong class="balance" id="balance">Rs 0</strong>
</div>

</div>

<div class="box">

<h2>نیا ریکارڈ</h2>

<label>قسم</label>
<select id="type">
<option value="income">آمدن</option>
<option value="expense">خرچ</option>
</select>

<label>رقم</label>
<input id="amount" type="number" placeholder="مثلاً 5000">

<label>تفصیل</label>
<input id="description" type="text" placeholder="مثلاً تنخواہ، راشن">

<label>تاریخ</label>
<input id="date" type="date">

<button onclick="addRecord()">ریکارڈ محفوظ کریں</button>

<div class="actions">
<button class="export" onclick="exportCSV()">CSV فائل بنائیں</button>
<button class="clear" onclick="clearAll()">تمام ریکارڈ حذف کریں</button>
</div>

</div>

<div class="box">

<h2>ریکارڈز</h2>

<input id="search" type="text"
placeholder="ریکارڈ تلاش کریں..."
oninput="showRecords()">

<p id="count"></p>

<div id="records"></div>

</div>

</div>

<script>

let records=JSON.parse(
localStorage.getItem("shahadatLedger")||"[]"
);

document.getElementById("date").value=
new Date().toISOString().split("T")[0];

function save(){
localStorage.setItem(
"shahadatLedger",
JSON.stringify(records)
);
}

function money(n){
return "Rs "+Number(n).toLocaleString("en-PK");
}

function addRecord(){

let type=document.getElementById("type").value;
let amount=Number(document.getElementById("amount").value);
let description=document.getElementById("description").value.trim();
let date=document.getElementById("date").value;

if(amount<=0){
alert("براہ کرم رقم لکھیں");
return;
}

if(!description){
alert("براہ کرم تفصیل لکھیں");
return;
}

if(!date){
alert("براہ کرم تاریخ منتخب کریں");
return;
}

records.unshift({
id:Date.now(),
type:type,
amount:amount,
description:description,
date:date
});

save();

document.getElementById("amount").value="";
document.getElementById("description").value="";

showRecords();

alert("ریکارڈ محفوظ ہوگیا");
}

function deleteRecord(id){

if(!confirm("کیا یہ ریکارڈ حذف کرنا ہے؟")) return;

records=records.filter(r=>r.id!==id);

save();
showRecords();
}

function clearAll(){

if(records.length===0){
alert("کوئی ریکارڈ موجود نہیں");
return;
}

if(!confirm("کیا تمام ریکارڈ حذف کرنے ہیں؟")) return;

records=[];
save();
showRecords();
}

function showRecords(){

let search=document.getElementById("search").value
.toLowerCase()
.trim();

let filtered=records.filter(r=>
r.description.toLowerCase().includes(search) ||
r.date.includes(search)
);

let income=records
.filter(r=>r.type==="income")
.reduce((a,r)=>a+Number(r.amount),0);

let expense=records
.filter(r=>r.type==="expense")
.reduce((a,r)=>a+Number(r.amount),0);

document.getElementById("income").textContent=money(income);
document.getElementById("expense").textContent=money(expense);
document.getElementById("balance").textContent=money(income-expense);

document.getElementById("count").textContent=
"کل ریکارڈ: "+records.length;

let box=document.getElementById("records");

if(filtered.length===0){
box.innerHTML='<div class="empty">کوئی ریکارڈ موجود نہیں</div>';
return;
}

box.innerHTML=filtered.map(r=>`

<div class="record">

<div class="recordTop">

<div>
<strong>${r.type==="income"?"آمدن":"خرچ"}</strong>
<div class="date">${r.date}</div>
</div>

<div class="amount ${r.type==="income"?"income":"expense"}">
${r.type==="income"?"+":"-"} ${money(r.amount)}
</div>

</div>

<div class="description">${escapeHTML(r.description)}</div>

<button class="delete"
onclick="deleteRecord(${r.id})">
حذف کریں
</button>

</div>

`).join("");
}

function escapeHTML(text){
return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function exportCSV(){

if(records.length===0){
alert("Export کرنے کے لیے کوئی ریکارڈ نہیں");
return;
}

let csv="\uFEFFقسم,رقم,تفصیل,تاریخ\n";

records.forEach(r=>{

let type=r.type==="income"?"آمدن":"خرچ";
let desc='"'+r.description.replace(/"/g,'""')+'"';

csv+=type+","+r.amount+","+desc+","+r.date+"\n";

});

let blob=new Blob([csv],{
type:"text/csv;charset=utf-8"
});

let url=URL.createObjectURL(blob);
let a=document.createElement("a");

a.href=url;
a.download="shahadat-ledger.csv";

document.body.appendChild(a);
a.click();
a.remove();

URL.revokeObjectURL(url);
}

showRecords();

</script>

</body>
</html>
