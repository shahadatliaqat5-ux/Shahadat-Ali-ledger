<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahadat Ledger</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f7fb;
  color:#172033;
}
.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}
header{
  background:#1769aa;
  color:white;
  padding:25px 20px;
  border-radius:0 0 20px 20px;
  text-align:center;
}
header h1{margin:0 0 6px;font-size:30px}
header p{margin:0;font-size:16px}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:18px 0;
}
.card{
  background:white;
  border-radius:14px;
  padding:16px;
  text-align:center;
  box-shadow:0 2px 10px #00000012;
}
.card small{display:block;color:#667085}
.card strong{font-size:22px;display:block;margin-top:5px}

.income{color:#16803c}
.expense{color:#c62828}
.balance{color:#1769aa}

.box{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 2px 10px #00000012;
}
.box h2{margin-top:0}

label{
  display:block;
  margin:10px 0 5px;
  font-weight:600;
}
input,select,button{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:16px;
}
button{
  border:0;
  background:#1769aa;
  color:white;
  font-weight:700;
  cursor:pointer;
}
button:hover{opacity:.9}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.export{background:#16803c}
.clear{background:#c62828}

.search{
  margin-bottom:15px;
}

.record{
  border:1px solid #e4e7ec;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  background:#fff;
}
.record-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.record-title{font-weight:700}
.record-date{color:#667085;font-size:13px}
.record-amount{font-size:19px;font-weight:800}
.record-desc{
  margin-top:7px;
  color:#475467;
}
.delete{
  width:auto;
  padding:7px 12px;
  background:#c62828;
  font-size:13px;
  margin-top:10px;
}

.empty{
  text-align:center;
  color:#667085;
  padding:25px;
}

.count{
  text-align:center;
  color:#667085;
  margin-bottom:10px;
}

@media(max-width:650px){
  .cards{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr}
  header h1{font-size:25px}
}
</style>
</head>

<body>

<header>
