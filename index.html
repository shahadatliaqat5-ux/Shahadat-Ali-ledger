<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shahdat Supplier Ledger</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f6;font-family:Arial;color:#172033}
header{background:#1769aa;color:white;text-align:center;padding:20px 10px;border-radius:0 0 25px 25px}
header h1{margin:0 0 6px;font-size:27px}
.wrap{max-width:1100px;margin:auto;padding:12px}
.box{background:white;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}
.info,.summary{display:grid;gap:10px}
.info{grid-template-columns:2fr 1fr 1fr}
.summary{grid-template-columns:repeat(3,1fr)}
.card{background:#f7f9fc;border-radius:14px;padding:15px}
.card small{display:block;color:#667085;font-weight:bold;font-size:15px}
.card b{display:block;font-size:22px;margin-top:7px}
.red{color:#b52d32}.green{color:#198754}.blue{color:#1769aa}
.search{width:100%;padding:13px;border:1px solid #ccd3dc;border-radius:10px;font-size:16px}
.table{overflow:auto}
table{width:100%;min-width:950px;border-collapse:collapse;font-size:13px}
th{background:#1769aa;color:white;padding:10px}
td{border:1px solid #d9dee5;padding:8px;vertical-align:top}
tr:nth-child(even){background:#fafbfd}
.num{text-align:right;white-space:nowrap}
button{border:0;border-radius:7px;padding:8px 11px;color:white;font-weight:bold}
.edit{background:#1769aa}.save{background:#198754}.cancel{background:#667085}
.editbox{width:100%;padding:7px;border:1px solid #b9c2cc;border-radius:6px}
@media(max-width:700px){
.info,.summary{grid-template-columns:1fr}
header h1{font-size:23px}
}
@media print{
.noPrint{display:none!important}
.box{box-shadow:none}
table{min-width:0;font-size:9px}
}
</style>
</head>

<body>
<header>
<h1>Mr.Shahdat Installer</h1>
<div>Account No: 9028C</div>
<div>Date From: 01/01/2025 to 30/04/2025</div>
</header>

<div class="wrap">

<div class="box info">
<div class="card"><small>Supplier</small><b>Mr.Shahdat Installer</b></div>
<div class="card"><small>Account No.</small><b>9028C</b></div>
<div class="card"><small>Brought Forward</small><b class="red">-44,589.30</b></div>
</div>

<div class="box summary">
<div class="card"><small>Total Debit</small><b id="debit" class="red">0.00</b></div>
<div class="card"><small>Total Credit</small><b id="credit" class="green">0.00</b></div>
<div class="card"><small>Closing Balance</small><b id="closing" class="blue">0.00</b></div>
</div>

<div class="box noPrint">
<input id="search" class="search" placeholder="Search details / Ref / V.No..." oninput="show()">
<br><br>
<button onclick="window.print()" style="background:#198754;width:100%;font-size:16px">
